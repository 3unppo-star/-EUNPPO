  .no-tt{ flex:1; min-width:0; }
  .no-title{ font-family:var(--disp); font-weight:800;

  .no-date{ font-size:calc(11.5px * var(--fs-label)); color:var(--text-soft); margin-top:5px; }
  .no-arrow{ flex-shrink:0; color:var(--text-soft); font-size:calc(15px * var(--fs-body));

  .no-item.open .no-arrow{ transform:rotate(180deg); }
  .no-body{ display:none; padding:0 22px 20px; }
  .no-item.open .no-body{ display:block; }
  .no-text{ font-size:calc(14.5px * var(--fs-body)); color:var(--text-mid);

  .no-imgs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));

  .no-imgs img{ width:100%; border-radius:12px; border:1px solid var(--line-soft); cursor:pointer; }

<script>
let notices = [];

async function init(){
  try { notices = await fetchAll('notice', { order:'created_at', asc:false }); } catch (e) { notices = []; }
  /* pinned first, newest first within each group */
  notices.sort(function (a, b) {
    if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  render();
  try { applyHeading('notice', await window.profileData || {}); } catch (e) {}
  document.body.classList.add('ready');
  enableIframeAutoHeight();
}

function imagesOf(n){
  var out = [];
  if (Array.isArray(n.images)) out = n.images.filter(Boolean);
  else if (typeof n.images === 'string' && n.images.trim()) {
    try { var p = JSON.parse(n.images); if (Array.isArray(p)) out = p.filter(Boolean); }
    catch (e) { out = n.images.split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean); }
  }
  if (n.image_url) out.unshift(n.image_url);
  return out;
}

function render(){
  var el = document.getElementById('no-list');
  if (!notices.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">🌿</span>아직 올라온 공지가 없어요' +
      '<br><span class="empty-sub">공지가 올라오면 여기에 먼저 떠요</span></div>';
    return;
  }
  el.innerHTML = notices.map(function(n, i){
    var imgs = imagesOf(n);
    return '<div class="no-item' + (n.pinned ? ' pin' : '') + '" data-i="' + i + '">' +
      '<div class="no-head">' +
        (n.pinned ? '<span class="no-badge">📌 고정</span>' : '') +
        '<div class="no-tt"><div class="no-title">' + esc(n.title) + '</div>' +
        '<div class="no-date">' + esc(fmtDate(n.created_at) || '') + '</div></div>' +
        '<span class="no-arrow">▾</span>' +
      '</div>' +
      '<div class="no-body">' +
        (n.content ? '<div class="no-text">' + esc(n.content) + '</div>' : '') +
        (imgs.length ? '<div class="no-imgs">' + imgs.map(function(u, k){
          return '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" loading="lazy" data-img="' + i + '-' + k + '">';
        }).join('') + '</div>' : '') +
      '</div></div>';
  }).join('');
  var first = el.querySelector('.no-item');
  if (first) first.classList.add('open');
}

document.getElementById('no-list').addEventListener('click', function(e){
  var img = e.target.closest('[data-img]');
  if (img) { openLb(img.getAttribute('src')); return; }
  var head = e.target.closest('.no-head');
  if (!head) return;
  head.parentElement.classList.toggle('open');
  enableIframeAutoHeight();
});

function openLb(src){
  document.getElementById('lb-body').innerHTML =
    '<img src="' + esc(src) + '" alt="" referrerpolicy="no-referrer">' +
    '<button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="closeLb()">닫기</button>';
  var ov = document.getElementById('ov');
  ov.style.top = Math.max(10, (LAST_Y || window.scrollY + 140) - 80) + 'px';
  ov.classList.add('show');
}
function closeLb(){
  var ov = document.getElementById('ov');
  if (ov) ov.classList.remove('show');
}

init();
setTimeout(function(){ document.body.classList.add('ready'); }, 1200);
</script>
<script src="../fx.js"></script>

})();
