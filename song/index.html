  #randBox{ margin:14px 0 4px; min-height:70px; display:flex; flex-direction:column; justify-content:center; }
  #randBox.rolling{ opacity:.55; }
  #randBox.hit{ animation:pop .42s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop{ from{ transform:scale(.9); } to{ transform:scale(1); } }
  @media (prefers-reduced-motion:reduce){ #randBox.hit{ animation:none; } }
  #randTitle{ font-family:var(--disp); font-weight:800; font-size:calc(23px * var(--fs-title));

<script>
/* Keep GENRES in sync with the admin genre select (admin/index.html #song-genre). */
var GENRES = ['전체','발라드','인디','K-Pop','J-Pop','OST','애니','기타'];
var PAGE = 30;
var songs = [], curGenre = '전체', curPage = 1, keyword = '';

async function init(){
  try { songs = await fetchAll('songs', { order:'id', asc:true }); } catch (e) { songs = []; }
  renderGenres(); render();
  try { applyHeading('song', await window.profileData || {}); } catch (e) {}
  document.body.classList.add('ready');
  enableIframeAutoHeight();
}

function renderGenres(){
  document.getElementById('genre-tabs').innerHTML = GENRES.map(function(g){
    return '<button class="gt' + (g === curGenre ? ' active' : '') + '" data-genre="' + esc(g) + '">' + esc(g) + '</button>';
  }).join('');
}
document.getElementById('genre-tabs').addEventListener('click', function(e){
  var b = e.target.closest('.gt'); if (!b) return;
  curGenre = b.dataset.genre; curPage = 1; renderGenres(); render(); enableIframeAutoHeight();
});

function filtered(){
  var q = keyword.toLowerCase();
  return songs.filter(function(s){
    var okG = curGenre === '전체' || s.genre === curGenre;
    return okG && (!q || txt(s.title).toLowerCase().indexOf(q) >= 0 || txt(s.artist).toLowerCase().indexOf(q) >= 0);
  });
}

function render(){
  var list = filtered();
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE));
  if (curPage > totalPages) curPage = 1;
  var pageItems = list.slice((curPage - 1) * PAGE, curPage * PAGE);
  document.getElementById('count').textContent = '총 ' + list.length + '곡 · ' + curPage + '/' + totalPages + ' 페이지';
  var body = document.getElementById('song-body');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="5"><div class="empty"><span class="empty-icon">🌿</span>' +
      (songs.length ? '조건에 맞는 곡이 없어요' : '아직 등록된 곡이 없어요') + '</div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  body.innerHTML = pageItems.map(function(s, i){
    var num = (curPage - 1) * PAGE + i + 1;
    var diff = parseInt(s.difficulty, 10) || 0;
    var dots = '';
    for (var k = 1; k <= 5; k++) dots += '<span class="dot' + (k <= diff ? ' on' : '') + '"></span>';
    return '<tr data-song="' + esc(s.title) + '">' +
      '<td class="s-num">' + num + '</td>' +
      '<td class="s-title">' + esc(s.title) + '</td>' +
      '<td class="hide-m">' + (esc(s.artist) || '-') + '</td>' +
      '<td><span class="s-genre">' + (esc(s.genre) || '기타') + '</span></td>' +
      '<td class="hide-m"><span class="s-diff">' + dots + '</span></td></tr>';
  }).join('');

  var pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages > 1) for (var i = 1; i <= totalPages; i++) {
    var b = document.createElement('button');
    b.className = 'pg' + (i === curPage ? ' active' : '');
    b.textContent = i; b.dataset.pg = i; pg.appendChild(b);
  }
}
document.getElementById('pagination').addEventListener('click', function(e){
  var b = e.target.closest('.pg'); if (!b) return;
  curPage = parseInt(b.dataset.pg, 10); render(); window.scrollTo(0, 0); enableIframeAutoHeight();
});
document.getElementById('search').addEventListener('input', function(e){
  keyword = e.target.value.trim(); curPage = 1; render(); enableIframeAutoHeight();
});

var PICKED = null, rolling = false;
function showPick(s, isFinal){
  PICKED = s;
  document.getElementById('randTitle').textContent = txt(s.title) || '—';
  document.getElementById('randArtist').textContent = txt(s.artist) || '아티스트 미상';
  var box = document.getElementById('randBox');
  box.classList.toggle('rolling', !isFinal);
  if (isFinal) { box.classList.remove('hit'); void box.offsetWidth; box.classList.add('hit'); }
}
function rollPick(){
  if (rolling) return;
  var arr = filtered();
  if (!arr.length) { showToast('뽑을 곡이 없어요'); return; }
  document.getElementById('randBox').hidden = false;
  if (arr.length === 1) { showPick(arr[0], true); return; }
  rolling = true;
  var n = 0, ticks = 14 + Math.floor(Math.random() * 6);
  (function tick(){
    showPick(arr[Math.floor(Math.random() * arr.length)], false);
    n++;
    if (n < ticks) setTimeout(tick, 45 + Math.pow(n / ticks, 3) * 210);
    else { showPick(arr[Math.floor(Math.random() * arr.length)], true); rolling = false; }
  })();
}
document.getElementById('randBtn').addEventListener('click', rollPick);
document.getElementById('randAgain').addEventListener('click', rollPick);
document.getElementById('randCopy').addEventListener('click', function(){
  if (!PICKED) { showToast('먼저 곡을 뽑아 주세요'); return; }
  var t = txt(PICKED.title) + (txt(PICKED.artist) ? ' - ' + txt(PICKED.artist) : '');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ showToast('복사했어요'); });
});

init();
setTimeout(function(){ document.body.classList.add('ready'); }, 1200);
</script>
